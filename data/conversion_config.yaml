# Parameters used by the conversion.py script
 conversion_parameters:
  main_folder_path : "/user/mspremulli/Language-Conditioned-Imitation-Learning/" # Path to the main folder.
  utility_folder_path : "/user/mspremulli/Multi-Task-LFD-Training-Framework/" # Path to the Multi-Task_LFD-Training-Framework folder.
  data_path : "/mnt/localstorage/mspremulli/Datasets/RT-1_Dataset/rt-1-data-release/" # Dataset path.
  save_path : "/mnt/localstorage/mspremulli/Datasets/RT-1_Converted_Dataset/" # Save destination folder.
