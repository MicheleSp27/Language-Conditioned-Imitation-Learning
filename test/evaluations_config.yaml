---
 evaluations_parameters:
  data_path : "/mnt/localstorage/mspremulli/Datasets/RT-1_Converted_Dataset/" # Path to the data.
  checkpoint_path : "/mnt/localstorage/mspremulli/Model_Checkpoints/rt1_checkpoints/rt-1_pretraining_checkpoint_epoch_8_loss_101.1661436528666_batch_32" # Path to the model checkpoint.
  number_of_trajectories : 8000 # Works only if balanced is set to false or testing on the real RT-1 Dataset.
  interval : 5 # Accuracy over the specified action token interval.
  balanced : False # If True, number_of_trajectories_for_variation trajectories are sampled for each task variation. If false, number_of_trajectories trajectories are sampled at random. Works only on MIVIA simulated Dataset.
  number_of_trajectories_for_variation : 10 # Number of trajectories for task variation. Works only on the MIVIA Simulated Dataset.
  seed : 42 # Seed for test reproducibility. 
  original : True # True if working with the original robotic platform and dataset. False, for MIVIA robotic platform and dataset.
  printing : False # If true, prints evaluation results step by step. False, only final results are printed.

# RT-1 Transformer Network Configuration for Original Robotic Platform.
 Transformer_Original : 
  _target_ : evaluations.TransformerNetwork
  use_original_robotic_platform : True
  train_step_counter : 0
  vocab_size : 256
  token_embedding_size : 512
  num_layers : 1
  layer_size : 4096
  num_heads : 8
  feed_forward_size : 512
  dropout_rate : 0.1
  time_sequence_length : 6
  crop_size : 256
  use_token_learner : True
  return_attention_scores : False
  params_dict :
      image_channels : 3
      image_height : 200
      image_width : 200
      image_space_low : 0.0
      image_space_high : 1.0
      world_vector_space_shape : 3
      world_vector_space_low : -1.0
      world_vector_space_high : 1.0
      rotation_delta_space_shape : 3
      rotation_delta_space_low : -3.14
      rotation_delta_space_high : 3.14
      gripper_closedness_space_shape : 1
      gripper_closedness_space_low : -1.0
      gripper_closedness_space_high : 1.0

# RT-1 Transformer Network Configuration for MIVIA Robotic Platform.
 Transformer_MIVIA : 
  _target_ : evaluations.TransformerNetwork
  use_original_robotic_platform : False
  train_step_counter : 0
  vocab_size : 256
  token_embedding_size : 512
  num_layers : 1
  layer_size : 4096
  num_heads : 8
  feed_forward_size : 512
  dropout_rate : 0.1
  time_sequence_length : 6
  crop_size : 256
  use_token_learner : True
  return_attention_scores : False
  params_dict :
      image_channels : 3
      image_height : 200
      image_width : 200
      image_space_low : 0.0
      image_space_high : 1.0
      x_axis_shape : 1
      x_axis_low : -0.007
      x_axis_high : 0.025
      y_axis_shape : 1
      y_axis_low : -0.016
      y_axis_high : 0.017
      z_axis_shape : 1
      z_axis_low : -0.018
      z_axis_high : 0.017
      roll_shape : 1
      roll_low : -0.06
      roll_high : 0.08
      pitch_shape : 1
      pitch_low : -0.11
      pitch_high : 0.05
      yaw_shape : 1
      yaw_low : -0.08
      yaw_high : 0.3
      gripper_closedness_space_shape : 2

