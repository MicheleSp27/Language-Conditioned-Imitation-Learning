  params_dict :
      image_channels : 3
      image_height : 200
      image_width : 200
      image_space_low : 0.0
      image_space_high : 1.0
      world_vector_space_shape : 3
      world_vector_space_low : -0.03
      world_vector_space_high : 0.03
      rotation_delta_space_shape : 3
      rotation_delta_space_low : -0.5
      rotation_delta_space_high : 0.5
      gripper_closedness_space_shape : 2

